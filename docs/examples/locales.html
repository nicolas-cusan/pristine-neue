<form>
  <div class="locale-switch" role="group" aria-label="Language">
    <button type="button" data-locale="en" aria-pressed="true">English</button>
    <button type="button" data-locale="de" aria-pressed="false">Deutsch</button>
    <button type="button" data-locale="fr" aria-pressed="false">Français</button>
  </div>
  <div class="field">
    <label for="locales-email">Email</label>
    <input id="locales-email" name="email" type="email" required data-pristine-required-message-de="Bitte gib deine E-Mail-Adresse ein" />
  </div>
  <button type="submit">Submit</button>
</form>
